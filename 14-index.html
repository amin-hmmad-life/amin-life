<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amin Life</title>
    <script>
/* Amin Life - per-user accounts gate (added 2026-11-24) */
(function(){
var USERS_KEY='amin_life_users', SES_KEY='amin_life_session';
function getUsers(){try{return JSON.parse(localStorage.getItem(USERS_KEY)||'{}')}catch(e){return{}}}
function saveUsers(u){localStorage.setItem(USERS_KEY,JSON.stringify(u))}
function applyUser(u){
  var us=getUsers(), prim=!!(us[u]&&us[u].primary);
  window.__AL_DB__=prim?'AminLifeDB':'AminLifeDB__'+u;
  window.__AL_SET__=prim?'amin_life_settings':'amin_life_settings__'+u;
  window.__AL_SV__=prim?'alsv1':'alsv1__'+u;
  window.__AL_USER__=u;
}
function enc(s){return new TextEncoder().encode(s)}
async function hashPw(pw,salt){
  var d=await crypto.subtle.digest('SHA-256',enc(salt+':'+pw));
  return Array.from(new Uint8Array(d)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
}
function boot(){
  if(window.__AL_BOOTED__)return;
  window.__AL_BOOTED__=1;
  var s=document.createElement('script');
  s.type='module';
  s.src='14-app.js';
  document.body.appendChild(s);
  chip();
}
function chip(){
  if(document.getElementById('al-chip'))return;
  var c=document.createElement('div');
  c.id='al-chip';
  c.style.cssText='position:fixed;bottom:10px;left:10px;z-index:99997;background:rgba(6,36,29,.85);color:#c9f5e6;font:13px sans-serif;direction:rtl;border-radius:20px;padding:6px 12px;display:flex;gap:8px;align-items:center;backdrop-filter:blur(4px)';
  c.innerHTML='<span>\u{1F464} '+String(window.__AL_USER__).replace(/[<>&]/g,'')+'</span><button id="al-out" style="background:#1abc9c;border:0;color:#04231b;font:700 12px sans-serif;border-radius:14px;padding:3px 10px;cursor:pointer">\u062E\u0631\u0648\u062C</button>';
  document.body.appendChild(c);
  c.querySelector('#al-out').onclick=function(){
    if(confirm('\u062A\u0633\u062C\u064A\u0644 \u0627\u0644\u062E\u0631\u0648\u062C\u061F')){
      localStorage.removeItem(SES_KEY);location.reload();
    }
  };
}
var CSS='#al-gate{position:fixed;inset:0;z-index:100002;background:linear-gradient(160deg,#1abc9c,#0d806a 55%,#06503f);display:flex;align-items:center;justify-content:center;font-family:sans-serif;direction:rtl;padding:20px;box-sizing:border-box}#al-gate *{box-sizing:border-box}#al-card{background:#06241d;border-radius:24px;padding:28px 22px;width:100%;max-width:360px;color:#fff;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}#al-card h1{margin:0 0 4px;font-size:28px}#al-card p.sub{color:#9fd8c6;font-size:14px;margin:0 0 18px}#al-tabs{display:flex;background:#0d3d32;border-radius:14px;padding:4px;margin-bottom:16px}#al-tabs button{flex:1;border:0;background:transparent;color:#9fd8c6;font:700 15px sans-serif;padding:9px;border-radius:11px;cursor:pointer}#al-tabs button.on{background:#1abc9c;color:#04231b}#al-card input{width:100%;font-size:16px;border-radius:12px;border:1px solid #1a5c4c;background:#0d3d32;color:#fff;padding:13px;margin:5px 0;outline:none}#al-card input:focus{border-color:#1abc9c}#al-go{width:100%;font-size:17px;border-radius:12px;border:0;background:#1abc9c;color:#04231b;font-weight:700;padding:13px;margin-top:12px;cursor:pointer}#al-msg{color:#ff9e9e;min-height:20px;font-size:14px;margin-top:8px}#al-note{color:#5f9384;font-size:12px;margin-top:14px}';
function showGate(){
  var st=document.createElement('style');st.textContent=CSS;document.head.appendChild(st);
  var g=document.createElement('div');g.id='al-gate';
  g.innerHTML='<div id="al-card"><h1>\u{1F331} Amin Life</h1><p class="sub">\u0633\u062C\u0644 \u0627\u0644\u062F\u062E\u0648\u0644 \u0639\u0634\u0627\u0646 \u062A\u0643\u0645\u0644</p>'
    +'<div id="al-tabs"><button id="t-in" class="on">\u062F\u062E\u0648\u0644</button><button id="t-up">\u062D\u0633\u0627\u0628 \u062C\u062F\u064A\u062F</button></div>'
    +'<input id="al-u" autocomplete="username" placeholder="\u0627\u0633\u0645 \u0627\u0644\u0645\u0633\u062A\u062E\u062F\u0645">'
    +'<input id="al-p" type="password" autocomplete="current-password" placeholder="\u0643\u0644\u0645\u0629 \u0627\u0644\u0633\u0631">'
    +'<input id="al-p2" type="password" autocomplete="new-password" placeholder="\u0643\u0631\u0631 \u0643\u0644\u0645\u0629 \u0627\u0644\u0633\u0631" style="display:none">'
    +'<button id="al-go">\u062F\u062E\u0648\u0644</button><div id="al-msg"></div>'
    +'<div id="al-note">\u0627\u0644\u062D\u0633\u0627\u0628\u0627\u062A \u0648\u0628\u064A\u0627\u0646\u0627\u062A\u0647\u0627 \u0645\u062A\u062E\u0632\u0646\u0629 \u0639\u0644\u0649 \u0627\u0644\u062C\u0647\u0627\u0632 \u062F\u0647 \u0628\u0633</div></div>';
  document.body.appendChild(g);
  var mode='in';
  var $=function(id){return g.querySelector(id)};
  function setMode(m){mode=m;$('#t-in').className=m==='in'?'on':'';$('#t-up').className=m==='up'?'on':'';
    $('#al-p2').style.display=m==='up'?'block':'none';
    $('#al-go').textContent=m==='up'?'\u0625\u0646\u0634\u0627\u0621 \u0627\u0644\u062D\u0633\u0627\u0628':'\u062F\u062E\u0648\u0644';
    $('#al-msg').textContent=''}
  $('#t-in').onclick=function(){setMode('in')};
  $('#t-up').onclick=function(){setMode('up')};
  async function go(){
    var u=$('#al-u').value.trim(), p=$('#al-p').value, m=$('#al-msg');
    if(!/^[A-Za-z0-9_.]{3,20}$/.test(u)){m.textContent='\u0627\u0633\u0645 \u0627\u0644\u0645\u0633\u062A\u062E\u062F\u0645: \u0663 \u062D\u0631\u0648\u0641 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644\u060C \u0625\u0646\u062C\u0644\u064A\u0632\u064A \u0648\u0623\u0631\u0642\u0627\u0645 \u0628\u0633';return}
    if(p.length<4){m.textContent='\u0643\u0644\u0645\u0629 \u0627\u0644\u0633\u0631 \u0644\u0627\u0632\u0645 \u0664 \u062D\u0631\u0648\u0641 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644';return}
    m.textContent='...';
    var users=getUsers();
    if(mode==='up'){
      if(users[u]){m.textContent='\u0627\u0633\u0645 \u0627\u0644\u0645\u0633\u062A\u062E\u062F\u0645 \u062F\u0647 \u0645\u0648\u062C\u0648\u062F \u0628\u0627\u0644\u0641\u0639\u0644';return}
      if(p!==$('#al-p2').value){m.textContent='\u0643\u0644\u0645\u062A\u0627 \u0627\u0644\u0633\u0631 \u0645\u0634 \u0632\u064A \u0628\u0639\u0636';return}
      var salt=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
      users[u]={salt:salt,hash:await hashPw(p,salt),primary:Object.keys(users).length===0,created:Date.now()};
      saveUsers(users);
    }else{
      if(!users[u]){m.textContent='\u0645\u0641\u064A\u0634 \u062D\u0633\u0627\u0628 \u0628\u0627\u0644\u0627\u0633\u0645 \u062F\u0647';return}
      var h=await hashPw(p,users[u].salt);
      if(h!==users[u].hash){m.textContent='\u0643\u0644\u0645\u0629 \u0627\u0644\u0633\u0631 \u063A\u0644\u0637';return}
    }
    localStorage.setItem(SES_KEY,u);
    applyUser(u);
    g.remove();
    boot();
  }
  $('#al-go').onclick=go;
  g.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  $('#al-u').focus();
}
function start(){
  var users=getUsers(), ses=localStorage.getItem(SES_KEY);
  if(ses&&users[ses]){applyUser(ses);boot()}else{showGate()}
}
if(document.body){start()}else{addEventListener('DOMContentLoaded',start)}
})();
</script>
